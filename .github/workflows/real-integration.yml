name: Mediaphile Real Server Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-lan-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install client
        run: npm ci
      - name: Build client
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Checkout exact pinned server source
        shell: bash
        run: |
          git clone https://github.com/thebrazenbeard/mediaphile-server.git "$RUNNER_TEMP/mediaphile-server"
          SHA=$(node -p "require('./api/contract-source.json').commit")
          git -C "$RUNNER_TEMP/mediaphile-server" checkout --detach "$SHA"
      - name: Run synthetic end-to-end test
        env:
          MEDIAPHILE_SERVER_DIR: ${{ runner.temp }}/mediaphile-server
        run: npm run e2e:real
